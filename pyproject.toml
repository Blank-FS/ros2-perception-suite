[project]
name = "MDP"
version = "0.1.0"
description = "Perception and planning ROS2 stack for autonomous vehicles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clip",
    "colcon-common-extensions>=0.3.0",
    "colcon-ros>=0.5.0",
    "numpy<2.0",
    "offroad-autonomy",
    "opencv-python>=4.11.0.86",
    "ultralytics>=8.4.23",
    # Jetson (JetPack 6.1/6.2, ROS Humble): PyPI's aarch64 torch is CPU-only.
    # 2.8 is the newest NVIDIA build that needs no extra system libraries
    # (2.9+ links cuDSS, which JetPack does not ship). Elsewhere, torch comes
    # from PyPI through ultralytics.
    "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
]

[tool.uv.sources]
offroad-autonomy = { path = "../orfd-lane-detection", editable = true }
clip = { git = "https://github.com/ultralytics/CLIP.git" }
torch = { index = "jetson-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" }
torchvision = { index = "jetson-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" }

[[tool.uv.index]]
name = "jetson-jp6-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+simple"
explicit = true
