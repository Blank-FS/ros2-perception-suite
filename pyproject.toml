[project]
name = "MDP"
version = "0.1.0"
description = "Perception and planning ROS2 stack for autonomous vehicles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clip",
    "colcon-common-extensions>=0.3.0",
    "colcon-ros>=0.5.0",
    "numpy<2.0",
    "offroad-autonomy",
    "opencv-python>=4.11.0.86",
    "ultralytics>=8.4.23",
]

[project.optional-dependencies]
# For backend:=tensorrt, installed with `uv sync --extra tensorrt`. x86-64
# only: on a Jetson, TensorRT ships with JetPack rather than PyPI. onnx,
# onnxslim and onnxruntime are what Ultralytics needs to build an engine.
# onnx uses ml-dtypes 0.5 types without requiring that version itself; 0.5
# needs numpy 2 on Python 3.13+, newer than Humble (3.10) and Jazzy (3.12).
tensorrt = [
    "tensorrt-cu12>=10,<10.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx>=1.12,<2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "ml-dtypes>=0.5; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.13'",
    "onnxslim>=0.1.71; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime-gpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
offroad-autonomy = { path = "../orfd-lane-detection", editable = true }
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[tool.uv]
# Jetson (ROS Humble, Python 3.10): torch and torchvision are not installed.
# The CUDA build has to match the device's JetPack (2.4 for JetPack 6.0's
# CUDA 12.2, newer for 6.1/6.2), and PyPI's aarch64 build is CPU-only, so the
# venv is created with --system-site-packages and uses the JetPack-matched
# build already installed on the device. Elsewhere, torch comes from PyPI.
override-dependencies = [
    "torch>=2.1; sys_platform != 'linux' or platform_machine != 'aarch64' or python_version != '3.10'",
    "torchvision; sys_platform != 'linux' or platform_machine != 'aarch64' or python_version != '3.10'",
]
