[project]
name = "mdp-model-testing"
version = "0.1.0"
description = "Evaluates the segmentation models on their own, without ROS or orfd-lane-detection"
requires-python = ">=3.10"
dependencies = [
    "av>=17.1.0",
    "numpy<2.0",
    "opencv-python>=4.11.0.86",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    # Pinned to the versions the reported results were measured with.
    "torch==2.10.0",
    "torchvision==0.25.0",
    "ultralytics==8.4.174",
]

[tool.uv]
package = false
